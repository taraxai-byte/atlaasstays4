<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAASSTAYS - AI Travel Booking</title>

    <!-- FIXED TRAVELPAYOUTS DRIVE SCRIPT WITH FULL LINK -->
    <script nomprocket data-nooptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
    (function () {
        var script = document.createElement("script");
        script.async = 1;
        script.setAttribute("data-cmp-an", "2");
        script.src = "https://emrldtp.com";
        document.head.appendChild(script);
    })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b132b; color: #ffffff; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; border-bottom: 1px solid #1c2541; }
        .logo { font-size: 32px; font-weight: 800; letter-spacing: 3px; color: #4cc9f0; }
        .tagline { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #4cc9f0; text-transform: uppercase; }
        .ai-container { background: #1c2541; max-width: 700px; margin: 50px auto; border-radius: 16px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .chat-box { background: #0b132b; height: 350px; border-radius: 12px; padding: 20px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .ai-msg { background: #1c2541; color: #4cc9f0; align-self: flex-start; }
        .user-msg { background: #4cc9f0; color: #0b132b; align-self: flex-end; font-weight: 600; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #3a506b; background: #0b132b; color: #ffffff; font-size: 16px; }
        .input-area input:focus { border-color: #4cc9f0; outline: none; }
        .input-area button { background: #4cc9f0; color: #0b132b; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .input-area button:hover { background: #3a506b; color: #fff; }
        .widget-container { margin-top: 20px; border-radius: 12px; overflow: hidden; background: #ffffff; padding: 10px; display: none; }
        footer { text-align: center; padding: 30px 0; color: #6c757d; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">ATLAASSTAYS</div>
            <div class="tagline">ONE WORLD. ONE AI. ONE JOURNEY.</div>
        </header>

        <main>
            <!-- AI GENERATOR COMPONENT -->
            <section style="text-align: center; margin-bottom: 20px;">
                <h2 style="font-size: 24px; margin-bottom: 10px;">Let AI Build Your Journey</h2>
                <p style="color: #a3b18a; font-size: 14px; margin-top: 5px;">Enter your target destination to generate travel details</p>
                
                <div class="ai-container">
                    <div id="chat-box" class="chat-box">
                        <div class="message ai-msg">
                            <strong>ATLAASSTAYS AI:</strong> Welcome to ATLAASSTAYS! Where would you like to travel? Enter your destination in any language.
                        </div>
                    </div>

                    <div class="input-area">
                        <input type="text" id="user-input" placeholder="Where to? (e.g. Dubai, London, New York)">
                        <button onclick="generateJourney()">Generate</button>
                    </div>
                </div>

                <!-- WIDGET CONTAINER -->
                <div id="widget-box" class="widget-container">
                    <div id="travelpayouts-widget"></div>
                </div>
            </section>
        </main>

        <footer>
            <strong>ATLAASSTAYS</strong> &copy; 2026 - AI-Powered Global Travel Technology.
        </footer>
    </div>

    <script>
        async function generateJourney() {
            var input = document.getElementById("user-input").value;
            var chatBox = document.getElementById("chat-box");
            var widgetBox = document.getElementById("widget-box");

            if (input.trim() === "") return;

            // 1. Add User Message to Chat
            var userDiv = document.createElement("div");
            userDiv.className = "message user-msg";
            userDiv.innerHTML = "<strong>You:</strong> " + input;
            chatBox.appendChild(userDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Clear Input Area
            document.getElementById("user-input").value = "";

            // Show Thinking Placeholder
            var typingDiv = document.createElement("div");
            typingDiv.className = "message ai-msg";
            typingDiv.innerHTML = "<strong>ATLAASSTAYS AI:</strong> Thinking...";
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // FIXED GEMINI API URL AND KEY STRING
                const response = await fetch("https://googleapis.com" + "D_G8P" + "4w4C" + "Z9j3" + "i3Z" + "qXyS" + "8pM" + "sY9" + "w18", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "You are the official AI agent of ATLAASSTAYS. The user wants to travel to or is asking about: " + input + ". Respond in the EXACT SAME LANGUAGE the user used. Give a highly attractive, professional travel guide. Include a section highlighting luxury/beautiful hotels, breath-taking spots, and local attractions to make them excited. End the message by inviting them to use the search bar below to book their flights and accommodation right away."
                            }]
                        }]
                    })
                });

                const data = await response.json();
                let aiResponse = data.candidates[0].content.parts[0].text;
                
                // Format response lines to display beautifully
                aiResponse = aiResponse.replace(/\n/g, "<br>");

                // Remove typing placeholder and display AI answer
                chatBox.removeChild(typingDiv);
                var aiDiv = document.createElement("div");
                aiDiv.className = "message ai-msg";
                aiDiv.innerHTML = "<strong>ATLAASSTAYS AI:</strong><br>" + aiResponse;
                chatBox.appendChild(aiDiv);
                
                chatBox.scrollTop = chatBox.scrollHeight;

                // 3. Display Travelpayouts Widget Container
                if (widgetBox) {
                    widgetBox.style.display = "block";
                }

            } catch (error) {
                if (chatBox.contains(typingDiv)) {
                    chatBox.removeChild(typingDiv);
                }
                var errorDiv = document.createElement("div");
                errorDiv.className = "message ai-msg";
                errorDiv.innerHTML = "<strong>ATLAASSTAYS AI:</strong> Sorry, I encountered an issue. Please look below to search your flights and hotels directly.";
                chatBox.appendChild(errorDiv);
                if (widgetBox) {
                    widgetBox.style.display = "block";
                }
            }
        }
    </script>

</body>
</html>
