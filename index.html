<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ATLAASSTAYS — AI-Powered Global Travel</title>
  <meta
    name="description"
    content="ATLAASSTAYS is an AI-powered global travel platform for flights, hotels, transfers and experiences."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 140, 0, 0.14), transparent 35%),
        #0d0600;
      color: #ffffff;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(13,6,0,.72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff8c00, #ffb347);
      color: #0d0600;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(255,140,0,.35);
    }

    .tagline {
      color: #ffb347;
      font-size: 11px;
      letter-spacing: 1.8px;
      margin-top: 3px;
    }

    .hero {
      min-height: 650px;
      display: flex;
      align-items: center;
      text-align: center;
      padding: 90px 0 70px;
    }

    .hero-content {
      max-width: 900px;
      margin: auto;
    }

    .eyebrow {
      color: #ff9d24;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 92px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    .gold {
      color: #ff9d24;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto 35px;
      color: rgba(255,255,255,.72);
      font-size: 18px;
      line-height: 1.7;
    }

    .ai-card {
      max-width: 760px;
      margin: 35px auto 0;
      padding: 28px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.055);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .ai-title {
      font-size: 13px;
      color: #ffb347;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <div class="brand-mark">AS</div>
        <div>
          <div>ATLAASSTAYS</div>
          <div class="tagline">AI-POWERED GLOBAL TRAVEL</div>
        </div>
      </div>
    </div>
  </header>

  <main class="hero">
    <div class="container hero-content">
      <div class="eyebrow">SMART TRAVEL DISCOVERY</div>
      <h1>One World. <span class="gold">One AI. One Journey.</span></h1>
      <p>ATLAASSTAYS is an AI-powered global travel platform for flights, hotels, transfers and experiences.</p>

      <!-- Halkan waxaa ku jira koodhkii oo wata lambarradiisii saxda ahaa ee Travelpayouts -->
      <div class="ai-card">
        <div class="ai-title">SEARCH FLIGHTS & HOTELS</div>
        
        <script
          async
          src="https://tpwdgt.com/content?currency=usd&trs=579177&shmarker=783281&powered_by=true&locale=en&show_header=true&limit=4&primary_color=00AE98&results_background_color=FFFFFF&form_background_color=FFFFFF&campaign_id=111&promo_id=4478"
          charset="utf-8">
        </script>
      </div>

    </div>
  </main>

</body>
</html>
